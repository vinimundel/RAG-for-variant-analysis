name: RAG tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,eval]'
      - name: Verify optional evaluator imports
        run: python -c "from ragas.metrics.collections import Faithfulness, ContextRecall"
      - name: Run isolated tests
        env:
          HF_HUB_OFFLINE: '1'
          RAGAS_DO_NOT_TRACK: 'true'
        run: python -m pytest -q
