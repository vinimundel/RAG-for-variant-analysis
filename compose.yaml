services:
  grobid:
    image: grobid/grobid:0.8.2
    ports:
      - "8070:8070"
    init: true
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/output/qdrant_server:/qdrant/storage
    restart: unless-stopped
